# Blackshear PTA - all homepage copy, in one file (PROJECT-BRIEF §5.4).
#
# Sourced from blackshearpta.weebly.com (Aug 2026) and the 2026-2027 PTA
# calendar. Where the two disagreed, the calendar won - the Weebly homepage
# still advertises the 2025-2026 meeting dates.
#
# Shape is enforced by src/content.config.ts. `npm run build` fails on a
# mismatch, which is the point - the schema is the contract between this copy
# and all six themes. None of the themes owns a word of it.
#
# Links marked TINYURL below are opaque redirects owned by whoever created
# them. See the note in the PR description; they are a maintenance risk, not
# a blocker.

home:
  meta:
    title: "Blackshear Elementary PTA - Austin, TX"
    description: "The PTA for Blackshear Fine Arts Academy in East Austin. Join, donate, volunteer, and keep up with what's happening at Austin's oldest operating elementary school."

  # Shown only by themes that opt in (see `video` in src/themes/registry.ts).
  # Currently Civic Letterpress B, which renders it inside the hero between the
  # headline and the intro line, so the board can compare it against A.
  video:
    youtubeId: "RKn8SJQcXEI"
    title: "Blackshear Elementary: 135 years in East Austin"

  hero:
    headline: "Alone we can do so little, together we can do so much"
    subhead: "Blackshear Elementary PTA is a community of parents, caretakers, teachers, and staff supporting Austin's oldest operating elementary school - 135 years in East Austin and counting."

  quickActions:
    heading: "Start here"
    items:
      - label: "Join the PTA"
        href: "https://tinyurl.com/BlackshearStore"
        note: "Membership dues - takes about two minutes"
      - label: "Donate"
        href: "https://www.zeffy.com/en-US/ticketing/2026-2027-blackshear-elementary-shop"
        note: "Zeffy - 100% goes to the PTA, no platform fee"
      - label: "Volunteer"
        href: "https://blackshearpta.weebly.com/volunteer.html"
        note: "Current sign-ups and opportunities"
      - label: "Calendar"
        href: "https://blackshearpta.weebly.com/calendar.html"
        note: "Meetings, bake sales, and school events"
      - label: "Sign up for the newsletter"
        href: "https://tinyurl.com/BlackshearNewsletterSignup"
      - label: "Help with school supplies"
        href: "https://tinyurl.com/BlackshearSuppliesHelp"

  news:
    heading: "What's happening"
    items:
      - title: "135 years in East Austin"
        body: "Blackshear is celebrating 135 years, and KUT's ATXplained confirmed what we suspected - it's Austin's oldest operating elementary school. KVUE covered the celebration too."
        href: "https://tinyurl.com/BlackshearATXplained"
      - title: "The Literacy Buzz Bowl returns"
        body: "Our own take on Battle of the Books. Parent volunteers read to 3rd, 4th, and 5th graders, then students compete in a trivia showdown, and celebrate with ice cream and donuts. PTA is sponsoring it again this year."
        href: "https://blackshearpta.weebly.com/"
      - title: "No Sting Fundraiser #3 was a success"
        body: "The final numbers are in and we hit our goal. Missed it? You can still make a general donation or help us stock school supplies."
        href: "https://tinyurl.com/Donate2Blackshear"
      - title: "Let's keep Blackshear where it is"
        body: "Our campus has been part of this neighborhood for 135 years. Learn about the effort to keep it here for the next 135."
        href: "https://www.saveblackshear.org"

  getInvolved:
    heading: "How to get involved"
    intro: "We know life is busy, but our kids deserve the best experience we can give them, and we need you to help us do that. Pick the row that matches the time you actually have."
    tiers:
      - commitment: "No time at all"
        description: "Pay your dues and become a member. That alone funds the programs below, and it's the single most useful thing you can do in two minutes."
        cta:
          label: "Become a member"
          href: "https://tinyurl.com/BlackshearStore"
      - commitment: "An hour or two"
        description: "Come to a PTA meeting. We meet seven times this year, alternating mornings and evenings, with one virtual. Coffee, juice, and snacks provided."
        cta:
          label: "RSVP for a meeting"
          href: "https://tinyurl.com/BlackshearPTAMeetingSignups"
      - commitment: "Three or four hours"
        description: "Help with a monthly bake sale, refresh the decorations in the teachers' lounge, pull weeds at the spring garden work day, or run a station on Bike to School Day."
        cta:
          label: "See volunteer opportunities"
          href: "https://blackshearpta.weebly.com/volunteer.html"
      - commitment: "More time than that"
        description: "Join a committee, or just get in touch and tell us what you're good at. We will find something."
        cta:
          label: "Email the PTA"
          href: "mailto:blackshearpta@gmail.com"

  committees:
    heading: "Committees"
    intro: "Every committee is looking for help. None of them require experience - just showing up."
    items:
      - name: "Fine Arts / Little EAST"
        art: little-east
        href: "/little-east"
        description: "Finds fun ways for families to engage with the Fine Arts Academy. We join the Austin Studio Tours and turn the school into a gallery, students perform, the drama club does Shakespeare and improv, and we host a silent auction."
      - name: "Fundraising"
        art: fundraising
        href: "/sponsors"
        description: "Comes up with new ways to support Blackshear financially. Secures Little EAST silent auction donations and runs the monthly after-school snack sales."
      - name: "Staff Appreciation"
        art: staff-appreciation
        href: "/staff-appreciation"
        description: "Shows Blackshear teachers, administrators, and support staff some appreciation - staff lunches, coffee and treats in the breakroom, replacing missing supplies, and self-care like massages or gift cards to local businesses."
      # Renamed from "Garden" 2026-08-31 at the board's request.
      - name: "Campus Beautification"
        art: campus-beautification
        href: "/campus-beautification"
        description: "Connects families interested in campus beautification and getting outdoors. Join if you like getting dirty, recycling, and gardening."

  footer:
    orgName: "Blackshear Elementary PTA"
    contact:
      email: "blackshearpta@gmail.com"
      phone: "(512) 402-2023"
      address: "1712 E. 11th St., Austin, TX 78702"
