# Little pictures on the calendar.
#
# Events come from Google Calendar, which has nowhere sensible to attach an
# image, so the picture is chosen HERE by matching words in the event title.
#
# Matching on the title rather than tagging each event is deliberate. A school
# calendar is mostly the same handful of things repeating - bake sales, PTA
# meetings, work days - so one rule covers every future occurrence
# automatically, including ones nobody has created yet. Tagging events one at a
# time would be work that never ends.
#
# TO ADD A PICTURE: add a rule below. `match` is case-insensitive and matches
# anywhere in the event title. First matching rule wins, so put specific rules
# above general ones. `art` must be one of the slugs listed in
# src/components/CalendarGrid.astro.
#
# Leave an event unmatched and it simply shows as text, which is fine - and
# usually better. A first pass matched "teacher", which put a photo of the
# campus beside every staff birthday and turned a tidy month into a wall of
# thumbnails. Match things that ARE an event, not words that happen to appear
# in one.

calendar:
  rules:
    - match: "bake sale"
      art: bake-sale
    - match: "little east"
      art: little-east
    - match: "garden"
      art: garden
    - match: "work day"
      art: garden
    - match: "staff appreciation"
      art: staff-appreciation
    - match: "pta meeting"
      art: campus
    - match: "general meeting"
      art: campus
