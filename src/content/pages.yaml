staff-appreciation:
  meta:
    title: "Staff Appreciation - Blackshear PTA"
    description: "The Staff Appreciation committee shows Blackshear teachers, administrators and support staff that the work is seen."
  title: "Staff Appreciation"
  # NO WEEBLY PAGE EXISTS for this committee. Copy below is expanded from the
  # homepage committee blurb and the volunteer page's PDF. Needs a real pass
  # from whoever chairs it - the chair seat was vacant as of 2026-2027.
  lede: "Teachers and staff carry this school. This is how we say so out loud."
  backdrop: campus-flagpole
  body:
    - "We show Blackshear teachers, administrators and support staff some appreciation: staff lunches, coffee and treats in the breakroom, replacing supplies that have gone missing, and self-care like massages or gift cards to local businesses."
    - "It is one of the easiest committees to help with. Most of what we do takes an hour, and none of it needs experience."
  cta:
    label: "Volunteer with us"
    href: "https://tinyurl.com/VolunteeratBlackshear"
  sections:
    - heading: "How to help"
      body:
        - "Every volunteer on campus needs an annual Austin ISD background check before helping in person. It is free and takes a few minutes."
      links:
        - label: "AISD Voly background check"
          href: "https://austinisd.voly.org/volunteer/home.html"
          note: "Required once a year for all campus volunteers"
        - label: "Staff appreciation overview"
          href: "https://drive.google.com/file/d/1B3Jrx3KjhITmpNIzltQGhJnPQLP1NF7W/view?usp=sharing"
          note: "PDF on Google Drive"
      names: []
  contact:
    email: "blackshearpta@gmail.com"
    note: "This committee is looking for a chair. Email us if you are interested."

campus-beautification:
  meta:
    title: "Campus Beautification - Blackshear PTA"
    description: "The Campus Beautification committee runs the Blackshear garden and campus work days in East Austin."
  title: "Campus Beautification"
  # NO WEEBLY PAGE EXISTS for this committee, and it was called "Garden" there.
  # Copy below is expanded from the homepage blurb plus the volunteer page's
  # garden work days PDF. Needs a real pass from the committee.
  lede: "The garden, the grounds, and every work day that keeps them going."
  backdrop: garden
  body:
    - "We connect families who are interested in campus beautification and getting outdoors. Join if you like getting dirty, recycling and gardening."
    - "Work days are the easiest way in. Show up, and there is always something to do."
  cta:
    label: "Volunteer with us"
    href: "https://tinyurl.com/VolunteeratBlackshear"
  sections:
    - heading: "How to help"
      body:
        - "Every volunteer on campus needs an annual Austin ISD background check before helping in person. It is free and takes a few minutes."
      links:
        - label: "AISD Voly background check"
          href: "https://austinisd.voly.org/volunteer/home.html"
          note: "Required once a year for all campus volunteers"
        - label: "Garden work days"
          href: "https://drive.google.com/file/d/1QaYYKEFyMKMBlbAnfgmvMfEuV4LXGb64/view?usp=share_link"
          note: "PDF on Google Drive"
