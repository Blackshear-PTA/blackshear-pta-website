          href: "https://tinyurl.com/12thLittleEAST"
          note: "Opens BiddingOwl"
        - label: "Photos by DesignLab44 (Marcus Charles)"
          href: "https://tinyurl.com/BlackshearLEPics"
          note: "Downloads a zip file from Dropbox"
      names: []
    - heading: "2024 - the 11th Little EAST"
      body: []
      links:
