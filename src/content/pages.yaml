staff-appreciation:
  meta:
    title: "Staff Appreciation - Blackshear PTA"
    description: "The Staff Appreciation committee shows Blackshear teachers, administrators and support staff that the work is seen."
  title: "Staff Appreciation"
  # NO WEEBLY PAGE EXISTS for this committee. Copy below is expanded from the
  # homepage committee blurb and the volunteer page's PDF. Needs a real pass
  # from whoever chairs it - the chair seat was vacant as of 2026-2027.
  lede: "Teachers and staff carry this school. This is how we say so out loud."
  backdrop: campus-flagpole
  body:
    - "We show Blackshear teachers, administrators and support staff some appreciation: staff lunches, coffee and treats in the breakroom, replacing supplies that have gone missing, and self-care like massages or gift cards to local businesses."
    - "It is one of the easiest committees to help with. Most of what we do takes an hour, and none of it needs experience."
  cta:
    label: "Volunteer with us"
    href: "/volunteer"
  sections:
    - heading: "How to help"
      body:
        - "Every volunteer on campus needs an annual Austin ISD background check before helping in person. It is free and takes a few minutes."
      links:
        - label: "AISD Voly background check"
          href: "https://austinisd.voly.org/volunteer/home.html"
          note: "Required once a year for all campus volunteers"
        - label: "Staff appreciation overview"
          href: "https://drive.google.com/file/d/1B3Jrx3KjhITmpNIzltQGhJnPQLP1NF7W/view?usp=sharing"
          note: "PDF on Google Drive"
      names: []
  contact:
    email: "hello@blackshearpta.org"
    note: "This committee is looking for a chair. Email us if you are interested."

campus-beautification:
  meta:
    title: "Campus Beautification - Blackshear PTA"
    description: "The Campus Beautification committee runs the Blackshear garden and campus work days in East Austin."
  title: "Campus Beautification"
  # NO WEEBLY PAGE EXISTS for this committee, and it was called "Garden" there.
  # Copy below is expanded from the homepage blurb. Needs a real pass from the
  # committee. A garden activity sheet exists since the 2026-2027 year began
  # (F24), and so do the work day and watering sign-ups linked below.
  lede: "The garden, the grounds, and every work day that keeps them going."
  backdrop: garden
  body:
    - "We connect families who are interested in campus beautification and getting outdoors. Join if you like getting dirty, recycling and gardening."
    - "Work days are the easiest way in. Show up, and there is always something to do."
  cta:
    label: "Volunteer with us"
    href: "/volunteer"
  sections:
    - heading: "How to help"
      body:
        - "Every volunteer on campus needs an annual Austin ISD background check before helping in person. It is free and takes a few minutes."
      links:
        - label: "Sign up for a work day"
          href: "https://tinyurl.com/BlackshearGardenDays"
          note: "SignUpGenius. The next ones are in the spring, and kids are welcome"
        - label: "Sign up to water the garden"
          href: "https://tinyurl.com/BlackshearWateringHelp"
          note: "SignUpGenius, ongoing"
        - label: "What the garden committee does"
          href: "https://tinyurl.com/BlackshearGardenInfo"
          note: "Activity sheet, PDF on Google Drive"
        - label: "AISD Voly background check"
          href: "https://austinisd.voly.org/volunteer/home.html"
          note: "Required once a year for all campus volunteers"
      names: []
  contact:
    email: "hello@blackshearpta.org"
    note: "Email the PTA and we will point you at the next work day."

volunteer:
  meta:
    title: "Volunteer - Blackshear PTA"
    description: "How to volunteer at Blackshear Elementary: the Austin ISD background check, then the sign-ups for what needs help now."
  title: "Volunteer"
  lede: "To make a difference in someone's life you don't have to be brilliant, rich, beautiful or perfect. You just have to care."
  backdrop: campus-flagpole
  body:
    - "Two steps, in this order. Both are free and neither takes long."
  # No interest form any more (Fundraising chair, via Jon, 2026-10-23): only
  # two people had filled it in. Step two is the sign-ups themselves.
  sections:
    - heading: "Step one: the background check"
      body:
        - "To chaperone field trips or volunteer on campus, every volunteer must register and complete an annual Austin ISD background check through Voly. It has to be renewed each school year, even if you did one last year."
      links:
        - label: "AISD Voly background check"
          href: "https://austinisd.voly.org/volunteer/home.html"
          note: "Required once a year, for everyone"
      names: []
    # The sign-ups open now, from the Fundraising chair (2026-10-23). Keep this
    # list current: add each new SignUpGenius here, and take one off once its
    # date has passed. "Stock the teachers' lounge" came off 2026-10-23: the
    # event was cancelled (Fundraising chair, via Jon).
    - heading: "Step two: sign up"
      body:
        - "Pick something below and choose a time that works for you."
      links:
        - label: "Little EAST volunteers"
          href: "https://tinyurl.com/BlackshearLEVolunteer"
          note: "Saturday, November 14. Our biggest event of the year"
        - label: "Pies and Sides Buffet"
          href: "https://tinyurl.com/BlackshearBuffet"
          note: "Thursday, November 19, for the school's Thanksgiving lunch"
        - label: "Water the garden"
          href: "https://tinyurl.com/BlackshearWateringHelp"
          note: "Ongoing"
        - label: "Garden work days"
          href: "https://tinyurl.com/BlackshearGardenDays"
          note: "The next ones are in the spring"
      names: []
    - heading: "What each event involves"
      body:
        - "Activity sheets explain what each event involves and how much time it takes."
      # The sheets the old site's homepage linked as of 2026-10-23. The Bike Day
      # and bake sale ones replace older copies, and the garden and Little EAST
      # ones did not exist when this page was built (F24).
      links:
        - label: "Bike to School Day"
          href: "https://tinyurl.com/BlackshearBikeDayInfo"
          note: "PDF on Google Drive"
        - label: "Monthly bake sales"
          href: "https://tinyurl.com/MonthlyBakeSaleInfo"
          note: "PDF on Google Drive"
        - label: "Staff appreciation"
          href: "https://drive.google.com/file/d/1B3Jrx3KjhITmpNIzltQGhJnPQLP1NF7W/view?usp=sharing"
          note: "PDF on Google Drive"
        - label: "Garden and campus beautification"
          href: "https://tinyurl.com/BlackshearGardenInfo"
          note: "PDF on Google Drive"
        - label: "Fine Arts and Little EAST"
          href: "https://drive.google.com/file/d/1FA7C538EDs7Ivaw0mEudjCDnvX1RtdV4/view?usp=share_link"
          note: "PDF on Google Drive"
      names: []
  contact:
    email: "hello@blackshearpta.org"
    note: "Not sure where you would fit? Email us and we will find something."

