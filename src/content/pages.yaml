# Blackshear PTA - standalone pages.
#
# Each top-level key below becomes a page. `little-east:` publishes
# /little-east. Adding a page means adding a block here; no code change.
# Shape is enforced by src/content.config.ts, so a typo fails the build rather
# than shipping a blank section.
#
# STARTING POINTS, NOT FINISHED COPY. Everything here is lifted from the
# current Weebly site to match its present state (TASKS.md A20). Rewriting is a
# later pass. Two of the four had no Weebly page at all and are noted inline.
#
# Broken links found while copying are corrected here and recorded in TASKS.md
# as F21-F24. Shipping a link that is already known to be dead is worse than
# not shipping it.

little-east:
  meta:
    title: "Fine Arts and Little EAST - Blackshear PTA"
    description: "The Fine Arts committee runs Little EAST, Blackshear's annual art show and silent auction, plus performances, drama club and the Austin Studio Tours."
  title: "Fine Arts / Little EAST"
  lede: "Blackshear is a Fine Arts Academy. This committee is how families get to be part of that."
  backdrop: little-east
  body:
    - "We find fun ways for families to engage with the Fine Arts Academy. We join the Austin Studio Tours and turn the school into a gallery, students perform, the drama club does Shakespeare and improv, and we host Little EAST, our annual silent auction."
    - "Little EAST is the PTA's largest event of the year and its largest single source of funding."
  cta:
    label: "Join the PTA"
    href: "https://tinyurl.com/BlackshearStore"
  sections:
