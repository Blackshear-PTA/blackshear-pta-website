sponsors:
  meta:
    title: "Sponsors - Blackshear PTA"
    description: "Family and business sponsorships supporting Blackshear Elementary students, families, teachers and staff in East Austin."
  title: "Sponsors"
  lede: "Support Blackshear students, families, teachers and staff by becoming a sponsor."
  backdrop: bake-sale
  body:
    - "We have family and business sponsorships."
    - "Our business sponsorship benefits provide valuable marketing exposure and advertising opportunities to over 200 families in our East Austin community. Sponsors play an integral role in funding Blackshear PTA activities, and our students, families, teachers and staff benefit tremendously."
    - "Thank you for supporting our school and the fine arts."
  cta:
    label: "Become a sponsor"
    href: "https://www.zeffy.com/en-US/ticketing/2026-2027-pta-memberships-and-sponsorships"
  sections:
    - heading: "2026-2027 sponsorship levels"
      body:
        - "Family Buzz ($100) comes with a PTA membership and your family's name on this page. The business levels run from Community Buzz ($250) to Champion Buzz ($1,000): your logo on this page, linked to your website, mentions on social media and in our newsletters, and a vinyl banner on the school fence for a year. The chart has every detail."
        - "Banners hang on the fence on 11th Street, Salina Street and the car rider line. Sponsors provide the final artwork as EPS, JPG, TIF, BMP, GIF, PNG or PDF, under 20MB."
      figures:
        - src: "../assets/sponsors/2026-2027/levels-2026-2027.jpg"
          alt: "The 2026-2027 sponsorship levels chart. Family Buzz, $100: PTA membership for up to two people and name recognition on the PTA website. Community Buzz, $250: recognition on social media and once in our newsletters, logo and link on the PTA website, logo on the silent auction banner, and a 2 by 4 foot banner on Salina Street. Supporter Buzz, $500: the same, twice in our newsletters, with a 3 by 6 foot banner on 11th Street by the main entrance. Partner Buzz, $750: three newsletters, the 11th Street banner, and logo on the silent auction website. Champion Buzz, $1,000: four newsletters, the 11th Street banner, logo on the silent auction website, and a second 3 by 6 foot banner on the car rider line."
          caption: "2026-2027 sponsorship levels"
      # This year's banners, photographed by the Fundraising chair (2026-10-26),
      # in order along the fence from the main building. They replace last
      # year's photos from the old site. Four of the eight she sent: the other
      # four repeat these views.
      photos:
        - src: "../assets/sponsors/2026-2027/fence-main-entrance.jpg"
          alt: "The school's main building behind the front fence, hung with banners: the PTA's Little EAST banner, then Thoughtbarn, Hush House and Design Lab 44"
        - src: "../assets/sponsors/2026-2027/fence-thoughtbarn-to-snooze.jpg"
          alt: "A row of sponsor banners on the school fence: Thoughtbarn, Hush House, Design Lab 44, Figure Eight Coffee Purveyors, TSO's free crab rangoons offer, Snooze and Neuron Garage's Growth Mindset Camp"
        - src: "../assets/sponsors/2026-2027/fence-snooze-to-mash.jpg"
          alt: "Further along the fence: banners for Snooze, Neuron Garage's Growth Mindset Camp, Micklethwait Barbecue, Industry, Kruger's Diamond Jewelers and MASH"
        - src: "../assets/sponsors/2026-2027/fence-micklethwait-to-big-bend.jpg"
          alt: "The far end of the fence under a tree: banners for Micklethwait, Industry, Kruger's Diamond Jewelers, MASH, Thayne's Baking Co. and Big Bend Coffee Roasters"
