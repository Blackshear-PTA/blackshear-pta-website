# Blackshear PTA - standalone pages.
#
# Each top-level key below becomes a page. `little-east:` publishes
# /little-east. Adding a page means adding a block here; no code change.
# Shape is enforced by src/content.config.ts, so a typo fails the build rather
# than shipping a blank section.
#
# STARTING POINTS, NOT FINISHED COPY. Everything here is lifted from the
# current Weebly site to match its present state (TASKS.md A20). Rewriting is a
# later pass. Two of the four had no Weebly page at all and are noted inline.
#
# Broken links found while copying are corrected here and recorded in TASKS.md
# as F21-F26. Shipping a link that is already known to be dead is worse than
# not shipping it.

little-east:
  meta:
    title: "Little EAST - Blackshear PTA"
    description: "Little EAST is Blackshear Elementary's free yearly art show and festival: student art, performances, the Trashion Show, screen printing and the PTA's silent auction, with photos and videos from past years."
  # About Little EAST only, since 2026-10-23 (Jon). The page used to introduce
  # the Fine Arts committee as a whole; the homepage still does, and links here.
  title: "Little EAST"
  lede: "Blackshear's yearly art show and festival, put on by the PTA. Free, and open to everyone."
  backdrop: little-east
  body:
    - "One Saturday each November, Blackshear Elementary Fine Arts Academy turns into a gallery. The halls fill with art from every grade, students perform on the front lawn, and families make things together in the craft courtyard."
    - "There is a Trashion Show, where students walk the runway in outfits made from recycled materials, a screen printing shop with that year's Little EAST design, and a silent auction. Little EAST is also an official stop on the Austin Studio Tour."
    - "It is the PTA's biggest event of the year and its largest single source of funding, so every bid and every shirt helps pay for the PTA's work at Blackshear."
  # No button here: "Join the PTA" did not fit a page about the event (Jon,
  # 2026-10-23). The 2026 section's sign-ups are the actions that do.
  # One section per year, newest first. Each folds shut under its heading:
  # `expanded: true` on the current year only, `false` on the rest. When a new
  # year goes on top, flip the old one to `false`.
  #
  # Everything below was carried over from the Weebly page (TASKS.md A40):
  # its two YouTube embeds, its links, and every poster, banner and photo, in
  # Weebly's order. The images are in src/assets/little-east/<year>/.
  #
  # Archived links point at where they actually land rather than at the
  # tinyurl. The 2026 planning doc reuses tinyurl.com/12thLittleEAST for this
  # year's auction, and a shortener repointed for a new year would silently
  # change what an old year's link opens (F61).
  sections:
    # From the committee's LITTLE EAST 2026 planning doc and the PTA's Weekly
    # Buzz (Jon, 2026-10-23). The performance schedule is still settling in the
    # doc, so only the parts that are fixed are here.
    #
    # The official poster arrived 2026-10-27 and replaced the "coming soon"
    # stand-in. It is the section's `poster`, shown large above the text, rather
    # than a figure at the bottom like past years' (Jon). When this year is
    # folded, it can move down into `figures` with the others.
    - heading: "2026 - the 13th Little EAST: Time Warp"
      expanded: true
      poster:
        src: "../assets/little-east/2026/poster.jpg"
        alt: "The 2026 Little EAST poster, Time Warp: Blackshear's yellowjacket mascot stands at the mouth of a school hallway drawn as a portal, among melting clocks and hourglasses. Join us for the 13th annual Little EAST, Blackshear Fine Arts Academy. Saturday, November 14th, 2026, 11am to 3pm, 1712 E. 11th St., free and open to the public. Student performances, Trashion Show, screen printing, craft activities, student art and a silent auction. Along the bottom, the logos of Film Kids, Diverse Space Dance Theatre, Beat4Beat, the Austin Studio Tour, Fe Press, UT's Shakespeare at Winedale and Groundwork Music Project, and a QR code for the silent auction."
        caption: "The official 2026 poster"
      body:
        - "Saturday, November 14, 2026, from 11am to 3pm, at Blackshear Elementary, 1712 E. 11th St. Free, open to everyone, and an official stop on the Austin Studio Tour."
        - "This year's theme is Time Warp. Step beyond the boundaries of time, into a portal of kids' creativity. You stand on the grounds of a 135-year-old school, where history awakens through imagination: eras come alive in student art galleries and performances, reality bends in our Time Warp room, and you make your own history with hands-on arts, crafts and activities."
        - "Every student from kindergarten to 5th grade has artwork on display. Performances run on the front lawn through the day, with the Trashion Show at 2:30, and Film Kids shows in the cafeteria all day."
        - "Also on: the screen printing shop, with clothing and totes in this year's limited-edition design; the craft courtyard, with shrinky dinks, buttons, friendship bracelets, comic strip bookmarks, Legos, rocks to paint for our front garden, free books from Carver Library, and Blackshear T-shirts to tie-dye; the Trashion makerspace in the art room, where anyone can make wearable art from trash; the silent auction; concessions; and the 5th grade bake sale. Wear your tie-dye!"
      links:
        - label: "Volunteer for a shift"
          href: "https://tinyurl.com/BlackshearLEVolunteer"
          note: "SignUpGenius. This is THE event to volunteer for"
        - label: "Bake for the 5th grade bake sale"
          href: "https://tinyurl.com/Blackshear5thBakeSale"
          note: "SignUpGenius. It raises money for our 5th graders"
        - label: "Add it to your calendar"
          href: "/calendar"
