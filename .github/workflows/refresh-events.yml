# Keeps /calendar current between pushes.
#
# The calendar is baked into the site at build time rather than fetched live
# (scripts/refresh-events.mjs explains why). That means it only changes when
# something rebuilds the site, and nobody pushes to a finished website every
# day. This does that instead.
#
# IT COMMITS DIRECTLY TO main. Only ever src/data/events.json, and only when the
# events actually changed. A daily pull request would be worse: somebody would
# have to merge it every morning, and within a week they would stop.
#
# The commit is what triggers Cloudflare to rebuild, so refreshing the data and
# publishing it are the same step.
#
# TO TURN IT OFF: delete this file, or comment out the `schedule:` block below
# to leave it runnable by hand from the Actions tab.

name: Refresh calendar

on:
  schedule:
    # 09:20 UTC, a little after 4am in Austin. Off the hour on purpose: GitHub
    # queues scheduled jobs, and everything asking for :00 waits behind
    # everything else asking for :00.
    - cron: '20 9 * * *'
  workflow_dispatch: # so it can be run by hand from the Actions tab

# Only what it needs: push one data file. Nothing here touches code.
permissions:
  contents: write

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Reads .node-version, so this never drifts from what the site builds with.
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Verifies the iCal reader still behaves before it is pointed at the live
      # feed. If the parser has regressed, the right outcome is to keep
      # yesterday's good snapshot rather than commit a broken one.
      - run: npm run check:ical

      - run: npm run refresh:events

      - name: Commit if the calendar changed
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/events.json; then
            echo "No calendar changes today."
            exit 0
          fi
          git config user.name  "blackshear-pta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/events.json
          COUNT=$(node -p "require('./src/data/events.json').events.length")
          git commit -m "Refresh calendar ($COUNT upcoming events)"
          git push
